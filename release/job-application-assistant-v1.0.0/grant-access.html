<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Job Extractor - Grant Access</title>
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        background: #f7f9fc;
        color: #19212a;
      }
      .panel {
        max-width: 560px;
        margin: 40px auto 0;
        padding: 22px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }
      p {
        color: #313b46;
        line-height: 1.5;
      }
      .host {
        font-weight: 700;
        color: #0a66c2;
      }
      button {
        margin-top: 12px;
        padding: 9px 14px;
        border: 1px solid #0a66c2;
        border-radius: 6px;
        background: #0a66c2;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #status {
        margin-top: 14px;
        color: #5b6673;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Grant access to fill this form</h1>
      <p>
        The application form on that page is embedded from
        <span class="host" id="hostName">this site</span>. Chrome requires explicit
        permission for that specific site before the Application Assistant can fill
        fields inside it. Nothing else about your browsing is affected.
      </p>
      <button id="grantBtn" type="button">Grant access</button>
      <p id="status"></p>
    </div>

    <script src="grant-access.js"></script>
  </body>
</html>
