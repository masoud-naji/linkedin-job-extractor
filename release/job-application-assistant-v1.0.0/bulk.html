<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Job Extractor - Bulk Import</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--bg-page);
        color: var(--ink);
      }
      .panel {
        max-width: 760px;
        margin: 0 auto;
        padding: 18px;
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow-card);
      }
      textarea {
        width: 100%;
        min-height: 170px;
        padding: 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: var(--panel);
        resize: vertical;
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }
      button {
        padding: 8px 12px;
        border: 1px solid var(--accent);
        border-radius: 6px;
        background: var(--accent);
        color: white;
        cursor: pointer;
      }
      button.secondary { background: var(--panel); color: var(--accent); }
      .status { margin-top: 12px; color: var(--muted); }
      .results {
        margin-top: 16px;
        border-top: 1px solid var(--border-soft);
        padding-top: 14px;
      }
      .import-meta {
        margin: 0 0 2px;
        color: var(--muted);
        font-size: 13px;
      }
      .import-summary {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      th, td {
        padding: 8px 6px;
        border-bottom: 1px solid var(--border-soft);
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 700;
      }
      .json-block {
        margin-top: 12px;
        padding: 10px;
        border-radius: 8px;
        background: var(--code-bg);
        color: var(--code-text);
        white-space: pre-wrap;
        overflow: auto;
        font-family: Consolas, monospace;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h1>Bulk Import</h1>
      <p>Paste LinkedIn job links here. Each link will be opened in a temporary tab, extracted, and stored locally.</p>
      <textarea id="bulkInput" placeholder="Paste LinkedIn job links (one per line or as markdown/HTML links)"></textarea>
      <div class="actions">
        <button id="bulkImport">Import jobs</button>
        <button id="bulkCopy" class="secondary">Copy saved JSON</button>
        <button id="bulkClear" class="secondary">Clear saved</button>
      </div>
      <p id="bulkStatus" class="status">No jobs saved yet.</p>

      <section class="results" id="resultsSection" hidden>
        <h2 id="resultsHeading">Previous Saved Jobs</h2>
        <p id="resultsMeta" class="import-meta" hidden></p>
        <p id="resultsSummary" class="import-summary" hidden></p>
        <table id="resultsTable">
          <thead>
            <tr>
              <th>Job Title</th>
              <th>Company</th>
              <th>Location</th>
              <th>Salary</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
        <div id="jsonView" class="json-block"></div>
      </section>
    </div>
    <script src="bulk.js"></script>
  </body>
</html>
