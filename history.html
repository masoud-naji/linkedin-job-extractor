<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>LinkedIn Job Extractor - Application History</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
      body {
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 20px;
        background: var(--bg-page);
        color: var(--ink);
      }
      .page {
        max-width: 720px;
        margin: 0 auto;
      }
      .page-header h1 {
        margin: 0 0 4px;
      }
      .page-header p {
        margin: 0 0 18px;
        color: var(--muted);
      }
      .empty-state {
        color: var(--muted);
      }
      .history-list {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .history-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-radius: 10px;
        background: var(--panel);
        box-shadow: var(--shadow-card);
        margin-bottom: 10px;
      }
      .history-main {
        min-width: 0;
      }
      .history-company {
        font-weight: 700;
        font-size: 14px;
      }
      .history-position {
        color: var(--muted);
        font-size: 13px;
        margin-top: 2px;
      }
      .history-docs {
        margin-top: 8px;
        display: flex;
        gap: 16px;
      }
      .history-doc {
        font-size: 12px;
      }
      .history-doc-label {
        color: var(--text-faint);
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-size: 10px;
      }
      .history-doc-value {
        color: var(--ink);
        margin-top: 1px;
      }
      .history-meta {
        text-align: right;
        white-space: nowrap;
      }
      .history-status-select {
        display: inline-block;
        padding: 3px 8px;
        border: none;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        font-family: inherit;
        cursor: pointer;
      }
      .history-status-select:focus {
        outline: 2px solid var(--accent-alt);
        outline-offset: 1px;
      }
      .history-date {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
      }
      .history-actions {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
      }
      .history-action-btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 11px;
        padding: 3px 8px;
        border-radius: 6px;
        cursor: pointer;
      }
      .history-action-btn:hover {
        background: var(--hover-bg);
      }
      .history-action-btn-danger {
        color: var(--danger);
        border-color: var(--danger-border-soft);
      }
      .history-action-btn-danger:hover {
        background: var(--danger-soft);
      }
      .history-date-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 4px 6px;
        margin-top: 16px;
      }
      .history-date-header:first-child {
        margin-top: 0;
      }
      .history-date-header-label {
        font-weight: 700;
        font-size: 13px;
        color: var(--ink);
      }
      .history-export-day-btn {
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 6px;
        cursor: pointer;
      }
      .history-export-day-btn:hover {
        background: var(--hover-bg);
      }
      .history-row-left {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-width: 0;
        flex: 1;
      }
      .history-select-checkbox {
        margin-top: 3px;
        flex-shrink: 0;
        cursor: pointer;
      }
      .selection-toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
        padding: 0 4px 10px;
      }
      .selection-count {
        font-size: 12px;
        color: var(--muted);
      }
      .selection-export-btn {
        border: 1px solid var(--accent-alt-solid);
        background: var(--accent-alt-solid);
        color: #fff;
        font-size: 11px;
        font-weight: 600;
        padding: 5px 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .selection-export-btn:hover {
        background: var(--accent-alt-solid-hover);
      }
      .hidden {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <h1>Application History</h1>
        <p>A local record of job applications you've submitted, newest first. Nothing is uploaded or shared.</p>
      </header>

      <p id="emptyState" class="empty-state hidden">No applications recorded yet.</p>

      <div id="selectionToolbar" class="selection-toolbar hidden">
        <span id="selectionCount" class="selection-count"></span>
        <button id="exportSelectedBtn" type="button" class="selection-export-btn">Export Selected</button>
      </div>

      <ul id="historyList" class="history-list"></ul>
    </div>

    <script src="application-history-storage.js"></script>
    <script src="status-config.js"></script>
    <script src="calendar-export.js"></script>
    <script src="history.js"></script>
  </body>
</html>
